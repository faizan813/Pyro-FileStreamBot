name: Deploy Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Dependencies
        run: |
          pip install tgcrypto motor aiohttp python-dotenv hydrogram
          # Redirecting Pyrogram imports to Hydrogram to fix all clock bugs permanently
          python3 -c "
          import os, sys
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.py'):
                      fp = os.path.join(root, file)
                      with open(fp, 'r') as f: content = f.read()
                      if 'pyrogram' in content:
                          content = content.replace('pyrogram', 'hydrogram')
                          with open(fp, 'w') as f: f.write(content)
          print('Imports successfully migrated to Hydrogram!')
          "

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIN_CHANNEL: ${{ secrets.BIN_CHANNEL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          PORT: 8080
          URL: 127.0.0.1
        run: python3 -m WebStreamer
        
