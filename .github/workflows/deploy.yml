name: Deploy Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Dependencies
        run: |
          pip install tgcrypto motor aiohttp python-dotenv pyrogram==1.4.16

      - name: Force Sync Global Clock
        run: |
          # यह कमांड पूरे ऑपरेटिंग सिस्टम की घड़ी को सीधे इंटरनेट टाइम सर्वर से मिलाकर सिंक कर देगी
          sudo timedatectl set-timezone UTC || true
          sudo ntpdate -u ://google.com || true

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIN_CHANNEL: ${{ secrets.BIN_CHANNEL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          PORT: 8080
          URL: 127.0.0.1
        run: python3 -m WebStreamer
        
