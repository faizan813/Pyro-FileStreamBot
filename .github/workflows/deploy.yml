name: Deploy Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Dependencies
        run: |
          pip install tgcrypto motor aiohttp python-dotenv pyrogram==1.4.16

      - name: Core Connection Timeout Patch
        run: |
          python3 -c "
          import site, os
          sp = site.getsitepackages()[0]
          sf = os.path.join(sp, 'pyrogram', 'session', 'session.py')
          if os.path.exists(sf):
              with open(sf, 'r') as f: content = f.read()
              content = content.replace('START_TIMEOUT = 10', 'START_TIMEOUT = 120')
              with open(sf, 'w') as f: f.write(content)
              print('Pyrogram timeout extended successfully!')
          "

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIN_CHANNEL: ${{ secrets.BIN_CHANNEL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          PORT: 8080
          URL: 127.0.0.1
        run: python3 -m WebStreamer
        
