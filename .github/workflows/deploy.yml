name: Deploy Bot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Inject Time Synchronization Fix
        run: |
          echo "import logging" > fix.py
          echo "from pyrogram import Client" >> fix.py
          echo "import pyrogram.session.session" >> fix.py
          echo "pyrogram.session.session.Session.START_TIMEOUT = 30" >> fix.py
          cat fix.py
          # Main script file inject check
          sed -i '1s/^/import pyrogram.session.session; pyrogram.session.session.Session.START_TIMEOUT = 30\n/' WebStreamer/__main__.py || true
          sed -i '1s/^/import pyrogram.session.session; pyrogram.session.session.Session.START_TIMEOUT = 30\n/' bot.py || true

      - name: Run Telegram Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BIN_CHANNEL: ${{ secrets.BIN_CHANNEL }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          PORT: ${{ secrets.PORT }}
        run: python3 -m WebStreamer
        
